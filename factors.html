  <style>
:root {
  --paper: #f5f4f0;
  --ink: #1b1a18;
  --muted: #706d66;
  --tile: #ffffff;
  --line: #d3d0c8;
  --good: #0c7a43;
  --bad: #b3261e;
  --focus: #155eab;
  --cell: 64px;
  --hintw: 168px;
  --hintr: 84px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Mulish', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

header h1 {
  font-family: 'Sansita', Georgia, serif;
  font-weight: 900;
  font-size: clamp(30px, 6vw, 44px);
  letter-spacing: 0.05em;
  text-align: center;
  margin: 0.7em 0 0;
}

.sub {
  text-align: center;
  color: var(--muted);
  font-weight: 600;
  font-size: 14px;
  margin: 0.2em 0 1.4em;
}

main {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 16px 64px;
}

#board {
  display: grid;
  grid-template-columns: repeat(4, var(--cell)) var(--hintw);
  grid-template-rows: repeat(4, var(--cell)) var(--hintr);
  gap: 6px;
  justify-content: center;
}

#sizes { display: flex; gap: 6px; justify-content: center; margin: 4px 0 20px; }
.sizebtn {
  padding: 6px 18px;
  font-size: 13px;
  border-radius: 999px;
  color: var(--muted);
}
.sizebtn.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

button.cell {
  width: 100%;
  height: 100%;
  font-family: var(--mono);
  font-size: 26px;
  text-align: center;
  color: var(--ink);
  background: var(--tile);
  border: 1.5px solid var(--line);
  border-radius: 9px;
  padding: 0;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
button.cell:hover { border-color: var(--muted); }
button.cell:focus {
  outline: none;
  border-color: var(--focus);
  box-shadow: 0 0 0 3px rgba(21, 94, 171, 0.16);
}
button.cell.active {
  border-color: var(--focus);
  box-shadow: 0 0 0 3px rgba(21, 94, 171, 0.35);
}
button.cell.dup, button.cell.badcell { border-color: var(--bad); color: var(--bad); }
button.cell.dragging { opacity: 0.4; }
button.cell.dropon { border-color: var(--good); background: rgba(12, 122, 67, 0.08); }

/* keypad popover */
#pad {
  position: absolute;
  z-index: 40;
  background: var(--tile);
  border: 1.5px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
  padding: 10px;
  width: 214px;
}
#pad[hidden] { display: none; }
#padgrid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
button.padnum {
  font-family: var(--mono);
  font-size: 17px;
  font-weight: 700;
  padding: 9px 0;
  border-radius: 8px;
  border: 1.5px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  cursor: pointer;
}
button.padnum:hover { border-color: var(--focus); }
button.padnum.used { opacity: 0.45; border-style: dashed; }
#padTrash {
  width: 100%;
  margin-top: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  border-radius: 8px;
  padding: 7px 0;
}
#padTrash:hover { color: var(--bad); border-color: var(--bad); }

.hint {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 10px;
  font-family: var(--mono);
  line-height: 1.35;
}
.hint .p { font-size: 15px; font-weight: 700; white-space: nowrap; }
.hint .p .f { font-weight: 700; }
.hint .p .e { opacity: 0.55; }
.hint .p .fdot { color: var(--muted); font-weight: 400; }
.hint .s { font-size: 13px; color: var(--muted); white-space: nowrap; }
.hint.bad .p, .hint.bad .s { color: var(--bad); }
.hint.c { align-items: center; padding: 4px 0; text-align: center; }
.hint.c .p { font-size: 11px; white-space: normal; line-height: 1.25; }
.hint.c .s { font-size: 11px; }
.blocks { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 4px; }
.blocks i { width: 9px; height: 9px; border-radius: 2px; }
.blocks .rest { opacity: 0.25; }
.blocks .over { box-shadow: inset 0 0 0 2px var(--bad); }
.hint.c .blocks { justify-content: center; max-width: 60px; }
.hint.corner { color: var(--muted); font-family: 'Mulish', sans-serif; font-size: 12px; }
.hint.corner .p, .hint.corner .s { font-size: 12px; color: var(--muted); font-weight: 400; }

#legend {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.55;
  max-width: 52ch;
  margin: 20px auto 8px;
  text-align: center;
}
#legend b { color: var(--ink); }

#controls {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: center;
  margin: 10px 0 4px;
}
button {
  font-family: 'Mulish', sans-serif;
  font-weight: 700;
  font-size: 14px;
  padding: 9px 22px;
  border-radius: 9px;
  border: 1.5px solid var(--line);
  background: var(--tile);
  color: var(--ink);
  cursor: pointer;
}
button:hover { border-color: var(--muted); }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
#timer { font-family: var(--mono); font-size: 15px; color: var(--muted); min-width: 44px; }

#status { text-align: center; min-height: 1.4em; font-weight: 600; font-size: 14px; color: var(--bad); }

#lab { margin-top: 28px; font-size: 14px; }
#lab summary { cursor: pointer; font-weight: 700; color: var(--muted); }
#labgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 8px 14px;
  margin: 14px 0;
}
#labgrid label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 3px; }
#labgrid input {
  font-family: var(--mono);
  font-size: 15px;
  padding: 6px 8px;
  border: 1.5px solid var(--line);
  border-radius: 7px;
  background: var(--tile);
  color: var(--ink);
  width: 100%;
}
#labResult { white-space: pre-wrap; font-size: 13px; color: var(--ink); min-height: 1.4em; }

#overlay {
  position: fixed;
  inset: 0;
  background: rgba(27, 26, 24, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
}
#overlay[hidden] { display: none; }
#overlayCard {
  background: var(--paper);
  border-radius: 16px;
  padding: 28px 32px;
  width: min(92vw, 420px);
  text-align: center;
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
}
#overlayCard h2 { font-family: 'Sansita', serif; margin: 0 0 6px; color: var(--good); }
#share {
  width: 100%;
  font-family: var(--mono);
  font-size: 12px;
  border: 1.5px solid var(--line);
  border-radius: 8px;
  padding: 8px;
  background: var(--tile);
  color: var(--muted);
  resize: none;
  margin: 10px 0;
}

@media (max-width: 460px) {
  :root { --cell: 52px; --hintw: 132px; --hintr: 72px; }
  #board { gap: 5px; }
  button.cell { font-size: 20px; }
  .hint .p { font-size: 12px; }
  .hint .s { font-size: 10px; }
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #16150f;
    --ink: #ece9df;
    --muted: #8f8b80;
    --tile: #211f18;
    --line: #3c392e;
    --focus: #6fa8dc;
  }
  button.primary { background: var(--ink); color: var(--paper); }

// FACTORS — solver engine. Pure functions, no DOM. Used by the game, the
// daily generator, and the uniqueness lab. Mirrors the Python prototype in
// tools/ that measured 99/100 of random 4x4 grids unique under
// row(sum,product) + col(sum,product) hints.

'use strict';

function gcd(a, b) { while (b) { [a, b] = [b, a % b]; } return a; }

// grid cells: flat array of n*n ints, row-major. null/0 = empty.
function lineStats(cells, n) {
  n = n || Math.round(Math.sqrt(cells.length));
  const rowS = [], rowP = [], colS = [], colP = [];
  for (let r = 0; r < n; r++) {
    let s = 0, p = 1;
    for (let c = 0; c < n; c++) { const v = cells[r * n + c]; s += v; p *= v; }
    rowS.push(s); rowP.push(p);
  }
  for (let c = 0; c < n; c++) {
    let s = 0, p = 1;
    for (let r = 0; r < n; r++) { const v = cells[r * n + c]; s += v; p *= v; }

const PRIME_COLORS = { 2: '#c0392b', 3: '#2471a3', 5: '#1e8449', 7: '#d68910', 11: '#7d3c98', 13: '#148f77' };

  const out = [];

  while (d * d <= m) {

      while (m % d === 0) { m /= d; e++; }
      out.push([d, e]);

// by the placed values vs still expected (shaded), plus over-budget ones.
function factorBudget(target, values) {

  for (const v of values) {
    if (!v) continue;

  for (const [p, tot] of need) {
    const u = used[p] || 0;
    out.push({ p, total: tot, filled: Math.min(u, tot), over: Math.max(0, u - tot) });
    delete used[p];

  for (const [p, u] of Object.entries(used)) out.push({ p: +p, total: 0, filled: 0, over: u });

  let h = '';
  for (const g of groups) {
    const c = PRIME_COLORS[g.p] || '#888888';
    for (let i = 0; i < g.filled; i++) h += `<i style="background:${c}"></i>`;
    for (let i = 0; i < g.over; i++) h += `<i class="over" style="background:${c}"></i>`;

    const p = [];
    for (let v = 1; v <= N; v++) if (colP[c] % v === 0 && rangeOk(v, colS[c])) p.push(v);

    colPool.push(p);

    const r = Math.floor(i / n), c = i % n;
    const list = rowPool[r].filter(v => colP[c] % v === 0 && rangeOk(v, colS[c]));

      if (!opts.length) { bi = i; bo = []; bl = 0; bc = false; break; }
      const cl = fillR[r] === n - 1 || fillC[c] === n - 1;
      if (opts.length < bl || (opts.length === bl && cl && !bc)) {
        bi = i; bo = opts; bl = opts.length; bc = cl;
      }

    if (bo === null) {
      count++;
      if (!first) first = asg.slice();
      return;
    }
    const r = Math.floor(bi / n), c = bi % n;
    for (const v of bo) {
      used |= 1 << v; asg[bi] = v;
      curRS[r] += v; curRP[r] *= v; curCS[c] += v; curCP[c] *= v;

  const r = countSolutions(rowS, rowP, colS, colP, 2);

// deterministic PRNG
function mulberry32(seed) {
  let a = seed >>> 0;

    a |= 0; a = (a + 0x6D2B79F5) | 0;

// Daily puzzle for an epoch-day number and board size n: shuffle grids until
// the hint set is provably unique. Deterministic per (day, n).
function generateDaily(epochDay, n = 4, maxTries = 20000) {

      e.dataTransfer.setData('text/plain', String(i));
      e.dataTransfer.effectAllowed = 'move';
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));
    el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('dropon'); });
    el.addEventListener('dragleave', () => el.classList.remove('dropon'));
    el.addEventListener('drop', (e) => {
      e.preventDefault();
      el.classList.remove('dropon');
      const src = parseInt(e.dataTransfer.getData('text/plain'), 10);
      if (Number.isNaN(src) || src === i) return;
      const cells = cur.cells;
      [cells[src], cells[i]] = [cells[i], cells[src]];
      render(); saveState();
      if (cells.every(x => x)) check();
      else if (!pad.hidden) positionPad();
    });
  }

  // ---- check / win -----------------------------------------------------------
  function clearMarks() {
    document.querySelectorAll('.badcell').forEach(el => el.classList.remove('badcell'));
    document.querySelectorAll('.hint.bad').forEach(el => el.classList.remove('bad'));
    $('#status').textContent = '';
  }

  function check() {
    clearMarks();
    const { n: m, N, cells, puzzle } = cur;
    if (cells.some(v => !v)) { $('#status').textContent = `Fill all ${N} cells.`; return; }
    if (!isPermutation(cells)) { $('#status').textContent = 'Duplicate numbers.'; return; }
    const st = lineStats(cells, m);
    const wrong = [];
    for (let r = 0; r < m; r++) if (st.rowS[r] !== puzzle.rowS[r] || st.rowP[r] !== puzzle.rowP[r]) wrong.push(['r', r]);
    for (let c = 0; c < m; c++) if (st.colS[c] !== puzzle.colS[c] || st.colP[c] !== puzzle.colP[c]) wrong.push(['c', c]);
    if (wrong.length === 0) return win();
    for (const [k, idx] of wrong) {
      const el = document.querySelector(`.hint.${k}${idx}`);
      if (el) el.classList.add('bad');
      for (let j = 0; j < m; j++) {
        cellEls[k === 'r' ? idx * m + j : j * m + idx].classList.add('badcell');
      }
    }
    $('#status').textContent = `${wrong.length} line${wrong.length > 1 ? 's' : ''} don't match.`;
  }

  function win() {
    cur.solved = true;
    closePad();
    tick();
    saveState();
    $('#overlay').hidden = false;
    $('#wintime').textContent = fmtMs(cur.ms);
    $('#overlaySize').textContent = `${cur.n}×${cur.n}`;
    const url = (window.F_CONFIG && F_CONFIG.gameUrl) || location.href.split('?')[0];
    $('#share').value = `FACTORS #${gameDay} ${cur.n}×${cur.n} in ${fmtMs(cur.ms)} — ${url}`;
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText($('#share').value).catch(() => {});
  }

  // ---- controls ---------------------------------------------------------------
  $('#btnCheck').addEventListener('click', () => { closePad(); check(); });
  $('#btnClear').addEventListener('click', () => {
    cur.cells = new Array(cur.N).fill(0);
    cur.ms = 0; cur.timerStart = Date.now(); cur.solved = false;
    saveState(); render(); clearMarks(); closePad(); tick();
  });
  $('#overlayBtn').addEventListener('click', () => { $('#overlay').hidden = true; });

  document.querySelectorAll('.sizebtn').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = parseInt(btn.dataset.n, 10);
      if (target === cur.n) return;
      tick(); saveState();               // pause current board's clock + state
      n = target;
      try { localStorage.setItem('factors:size', String(n)); } catch (e) {}
      document.querySelectorAll('.sizebtn').forEach(b => b.classList.toggle('on', b === btn));
      build(n);
    });
  });

  // ---- uniqueness lab -----------------------------------------------------------
  const lab = $('#labgrid');
  function buildLab(puzzle) {
    lab.innerHTML = '';
    const spec = [
      ['row sum', puzzle.rowS], ['row product', puzzle.rowP],
      ['col sum', puzzle.colS], ['col product', puzzle.colP],
    ];
    for (const [name, arr] of spec) {
      arr.forEach((v, i) => {
        const id = `${name.replace(' ', '')}${i}`;
        const lbl = document.createElement('label');
        lbl.innerHTML = `${name.charAt(0).toUpperCase()}${name.slice(1)} ${i + 1}<input id="${id}" type="number" value="${v}" inputmode="numeric">`;
        lab.appendChild(lbl);
      });
    }
  }
  $('#labRun').addEventListener('click', () => {
    const g = k => [...lab.querySelectorAll('input')]
      .filter(x => x.id.startsWith(k))
      .sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }))
      .map(x => parseInt(x.value, 10) || 0);
    const rs = g('rowsum'), rp = g('rowproduct'), cs = g('colsum'), cp = g('colproduct');
    const t0 = performance.now();
    const res = countSolutions(rs, rp, cs, cp, 2);
    const dt = (performance.now() - t0).toFixed(0);
    const N = rs.length * rs.length;
    let msg;
    if (res.count === 1 && !res.overflow) msg = `unique — exactly 1 solution (${dt} ms)`;
    else if (res.count >= 2) msg = `2+ solutions (${dt} ms)`;
    else if (res.overflow) msg = 'too large to count (node budget)';
    else msg = `no solution — inconsistent with 1–${N}`;
    if (res.first) {
      const m = rs.length;
      const rows = Array.from({ length: m }, (_, r) => res.first.slice(r * m, r * m + m).join(' ')).join('\n');
      msg += `\n\nOne solution:\n${rows}`;
    }
    $('#labResult').textContent = msg;
  });

  // ---- go ---------------------------------------------------------------
  document.querySelectorAll('.sizebtn').forEach(b => b.classList.toggle('on', parseInt(b.dataset.n, 10) === n));
  build(n);
})();

</script>
</body>
</html>
